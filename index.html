<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3a2a78">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="วันนี้">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>วันนี้</title>
<style>
@font-face{font-family:"TH Sarabun New";src:url(fonts/thsarabunnew-webfont.ttf) format("truetype");font-weight:400}
@font-face{font-family:"TH Sarabun New";src:url(fonts/thsarabunnew_bold-webfont.ttf) format("truetype");font-weight:700}
:root{--ink:#3a2a78;--ink2:#271b57;--text:#1f1b33;--mute:#6c6788;--line:#e0dcef;--paper:#f5f4fa;--now:#e5484d;--green:#1a8a5a}
*{box-sizing:border-box}
html,body{overflow-x:hidden;margin:0;color:var(--text);font-family:"TH Sarabun New",sans-serif;font-size:21px;line-height:1.5;-webkit-text-size-adjust:100%;background:var(--paper)}
body{min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid #a99cf0;outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;box-shadow:0 2px 0 var(--ink2)}
.hrow1{display:flex;align-items:center;gap:10px}
header img{width:40px;height:40px;border-radius:10px;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
header h1{font-size:30px;margin:0;flex:1;line-height:1.4;padding-top:4px}
#sync{font-size:16px;white-space:nowrap;background:rgba(255,255,255,.12);border-radius:999px;padding:1px 12px}
.iconbtn{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:12px;width:42px;height:40px;cursor:pointer;font-size:22px;display:grid;place-items:center}
.tabs{display:flex;gap:2px;justify-content:center;margin-top:8px;overflow-x:auto}
.tabs button{border:0;background:transparent;color:rgba(255,255,255,.72);font-size:21px;padding:4px 16px 6px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--paper);color:var(--ink);font-weight:700}
.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--now);color:#fff;font-size:15px;line-height:18px;margin-left:4px;vertical-align:2px}
main{max-width:860px;margin:0 auto;padding:14px 14px 120px}

/* แถบเลือกวัน */
.daynav{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.daynav .lbl{flex:1;line-height:1.3;padding-top:4px}
.daynav .lbl b{font-size:32px;color:var(--ink)} .daynav .lbl span{display:block;font-size:18px;color:var(--mute)}
.navbtn{border:1.5px solid var(--line);background:#fff;border-radius:999px;min-width:40px;height:38px;font-size:22px;cursor:pointer;padding:0 12px}
.progress{height:8px;background:var(--line);border-radius:8px;overflow:hidden;margin:2px 0 12px}
.progress i{display:block;height:100%;background:var(--green);border-radius:8px;transition:width .3s}
.quick{display:flex;gap:8px;margin-bottom:14px}
.quick input{flex:1;min-width:0;font-size:23px;border:2px solid var(--line);border-radius:14px;padding:6px 14px;background:#fff}
.quick input:focus{border-color:var(--ink);outline:none}
.qhint{font-size:17px;color:var(--mute);margin:-10px 0 12px 4px}

h2{font-size:22px;margin:16px 0 4px;color:var(--mute);font-weight:700;display:flex;align-items:center;gap:8px}
h2 .cnt{font-weight:400;font-size:18px}

/* เส้นเวลา */
.timeline{position:relative;padding-left:4px}
.item{position:relative;display:flex;align-items:flex-start;gap:10px;padding:7px 10px 7px 0;border-bottom:1px solid var(--line);background:transparent}
.item .time{flex:none;width:62px;text-align:right;font-size:19px;color:var(--mute);line-height:1.35;padding-top:3px}
.item .time b{display:block;color:var(--text);font-size:22px}
.item .rail{flex:none;width:6px;align-self:stretch;border-radius:4px}
.item .main{flex:1;min-width:0;cursor:pointer}
.item .title{font-size:23px;line-height:1.45;word-break:break-word}
.item .sub{font-size:17px;color:var(--mute);line-height:1.6;margin-top:2px}
.item .tag{display:inline-block;font-size:15px;border-radius:999px;padding:0 8px;color:#fff;vertical-align:2px;margin-right:4px}
.item.done .title{text-decoration:line-through;color:var(--mute)}
.item.skip .title{text-decoration:line-through;color:#a7a2bd}
.item.skip .rail{opacity:.3}
.check{flex:none;width:32px;height:32px;border-radius:50%;border:2.5px solid #b9b3d3;background:#fff;cursor:pointer;display:grid;place-items:center;margin-top:1px;padding:0}
.item.done .check{background:var(--green);border-color:var(--green)}
.item.done .check::after{content:"";width:12px;height:7px;border:solid #fff;border-width:0 0 3px 3px;transform:rotate(-45deg) translate(1px,-2px)}
.star{color:#e09b0b}
.nowline{display:flex;align-items:center;gap:8px;margin:2px 0;color:var(--now);font-weight:700;font-size:18px}
.nowline::before{content:"";width:62px;text-align:right}
.nowline i{flex:1;height:2px;background:var(--now);border-radius:2px;position:relative}
.nowline i::before{content:"";position:absolute;left:-5px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--now)}
.empty{background:#fff;border:2px dashed #cfc9e6;border-radius:16px;padding:22px 16px;text-align:center;color:var(--mute);font-size:21px}
.ext{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;margin-top:6px;text-decoration:none;color:var(--text)}
.ext .ic{font-size:24px}
.ext .t{flex:1;font-size:21px;line-height:1.45}
.ext .t small{display:block;color:var(--mute);font-size:17px;margin-top:2px}

/* สัปดาห์ */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:6px 8px;min-height:120px;cursor:pointer}
.wday.today{border-color:var(--ink);box-shadow:0 0 0 2px #d7d0f5}
.wday .wh{display:flex;align-items:baseline;gap:6px;border-bottom:1px solid var(--line);margin-bottom:4px}
.wday .wh b{font-size:22px;color:var(--ink)} .wday .wh span{font-size:17px;color:var(--mute)}
.wday .wi{font-size:17px;line-height:1.45;padding:2px 0 2px 6px;border-left:4px solid;margin:3px 0;word-break:break-word}
.wday .wi.done{text-decoration:line-through;color:var(--mute)}
@media (max-width:760px){.week{grid-template-columns:1fr}.wday{min-height:0}}

/* ตารางสอน */
.ttwrap{overflow-x:auto;background:#fff;border:1.5px solid var(--line);border-radius:14px}
table.tt{border-collapse:collapse;width:100%;min-width:760px;font-size:18px}
table.tt th,table.tt td{border:1px solid var(--line);padding:4px;text-align:center;vertical-align:middle}
table.tt th{background:#f0eef8;color:var(--ink);font-weight:700;line-height:1.35}
table.tt th small{display:block;font-weight:400;color:var(--mute);font-size:15px}
table.tt td.cell{cursor:pointer;height:72px;line-height:1.35}
table.tt td.cell:hover{background:#faf9fe}
table.tt td.cell.f{color:#fff;font-weight:700}
table.tt td.cell.f small{display:block;font-weight:400;opacity:.9;font-size:16px}
table.tt td.lunch{background:#f7f6fb;color:var(--mute);writing-mode:vertical-rl;font-size:16px}

.btn{white-space:nowrap;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:5px 14px;cursor:pointer;font-size:20px;color:var(--text)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.btn.green{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:var(--now)}
.btn.sm{padding:0 10px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.hint{font-size:18px;color:var(--mute)}

dialog{border:0;border-radius:22px;padding:0;width:min(580px,94vw);max-height:90vh;box-shadow:0 24px 70px rgba(39,27,87,.35);color:var(--text)}
dialog::backdrop{background:rgba(39,27,87,.45)}
dialog[open]{animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:600px){dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:22px 22px 0 0;max-height:92vh}.sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}.progress i{transition:none}}
.sheet{padding:18px 20px 20px;display:flex;flex-direction:column;gap:10px;overflow:auto;max-height:90vh}
.sheet h3{margin:0;font-size:30px;color:var(--ink)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:19px;color:var(--mute)}
label.f input,label.f select,label.f textarea{color:var(--text);font-size:23px;border:1.5px solid var(--line);border-radius:12px;padding:5px 12px;background:#fff;min-width:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1.5px solid var(--line);border-radius:999px;padding:3px 14px;cursor:pointer;background:#fff;font-size:21px}
.chip.on{border-color:var(--ink);background:var(--ink);color:#fff;font-weight:700}
.chip .dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:0}
.subs{display:flex;flex-direction:column;gap:4px}
.subs label{display:flex;gap:8px;align-items:center;font-size:21px}
.subs input[type=text]{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:2px 10px;font-size:21px;min-width:0}
.pabox{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.btn.dis{opacity:.45;pointer-events:none}
.stdgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.std{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 10px;display:flex;flex-direction:column;line-height:1.35}
.std b{font-size:24px;color:var(--ink)} .std span{font-size:17px;flex:1} .std em{font-style:normal;font-weight:700;color:var(--green)}
.std.none{border-style:dashed;background:#fff7f7} .std.none em{color:var(--now);font-weight:400}
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:6px}
.steps div{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:4px 8px;line-height:1.3;color:var(--mute)}
.steps div b{display:block;font-size:24px;color:#b9b3d3} .steps div span{font-size:15px}
.steps div.on b{color:var(--ink)} .steps div.on{border-color:#cfc6f0}
.review{background:#fff;border:2px solid #f3c7a8;border-radius:16px;padding:10px 12px;margin:8px 0;display:flex;flex-direction:column;gap:6px}
.rvhead{display:flex;gap:10px;align-items:flex-start}
.rvthumb{width:96px;height:96px;border-radius:10px;object-fit:cover;flex:none;background:#f0eef8}
.rvthumb.ph{display:grid;place-items:center;font-size:36px}
.stdpick{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px}
.stdpick button{border:1.5px solid var(--line);background:#fff;border-radius:10px;height:36px;font-size:19px;cursor:pointer;padding:0}
.stdpick button.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.review textarea{font-size:20px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));border-radius:999px;padding:10px 24px;font-size:22px;box-shadow:0 8px 22px -6px rgba(39,27,87,.6);z-index:4}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink2);color:#fff;border-radius:999px;padding:6px 22px;z-index:99;font-size:21px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
@media (max-width:520px){
  header{padding-left:12px;padding-right:12px} header h1{font-size:26px} header img{width:36px;height:36px}
  #sync{font-size:0;padding:0 4px;background:none} #sync::first-letter{font-size:20px}
  .tabs button{padding:4px 11px 6px;font-size:19px}
  main{padding-left:10px;padding-right:10px}
  .item .time{width:54px}
}
</style>
</head>
<body>
<header>
  <div class="hrow1">
    <img src="icon-192.png" alt="">
    <h1>วันนี้</h1>
    <span id="sync"></span>
    <button class="iconbtn" id="btnSettings" title="ตั้งค่า" aria-label="ตั้งค่า">⚙️</button>
  </div>
  <nav class="tabs">
    <button data-tab="day" class="on">วันนี้</button>
    <button data-tab="week">สัปดาห์</button>
    <button data-tab="inbox">กล่องงาน</button>
    <button data-tab="tt">ตารางสอน</button>
    <button data-tab="pa">ส่งงาน PA</button>
  </nav>
</header>
<main id="main"></main>
<button class="btn primary fab" id="btnAdd">+ เพิ่มงาน</button>
<dialog id="dlg"><div class="sheet" id="sheet"></div></dialog>
<div class="toast" id="toast"></div>

<script type="module">
/* ====================== ค่าคงที่ ====================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB5jzaZiPGq0oYPqB9MCljXAKzs05rhPBg",
  authDomain: "sirearth-tutor.firebaseapp.com",
  projectId: "sirearth-tutor",
  storageBucket: "sirearth-tutor.firebasestorage.app",
  messagingSenderId: "472071806564",
  appId: "1:472071806564:web:88e1ac2575318a320dc971",
};
const FIREBASE_VER = '10.12.2';
// ข้อมูลของแอปนี้ (เขียนได้)
const COL = { tasks: 'today_tasks', rules: 'today_rules', occ: 'today_occ', pa: 'today_pa' };
// ข้อมูลจากแอปอื่นในบัญชีเดียวกัน (อ่านอย่างเดียว)
const EXT = { students: 'students', sessions: 'sessions', invoices: 'invoices', splitServices: 'split_services', splitPayments: 'split_payments', splitPeople: 'split_people' };
const TUTOR_URL = 'https://spk1234-aff.github.io/tutor/', SPLIT_URL = 'https://spk1234-aff.github.io/split/';
const DEFAULT_SETTINGS = {
  cats: [
    { id: 'teach', name: 'สอน', color: '#2f5bd3' },
    { id: 'activity', name: 'กิจกรรม', color: '#0e8a9a' },
    { id: 'affairs', name: 'กิจการนักเรียน', color: '#1a8a5a' },
    { id: 'tutor', name: 'สอนพิเศษ', color: '#e0700f' },
    { id: 'personal', name: 'ส่วนตัว', color: '#8b46d6' },
  ],
  periods: [
    { n: 1, s: '08:30', e: '09:20' }, { n: 2, s: '09:20', e: '10:10' }, { n: 3, s: '10:20', e: '11:10' }, { n: 4, s: '11:10', e: '12:00' },
    { n: 5, s: '13:00', e: '13:50' }, { n: 6, s: '13:50', e: '14:40' }, { n: 7, s: '14:40', e: '15:30' },
  ],
  lunchAfter: 4,
  ttName: '',
  showTutor: true, showSplit: true,
};
const TH_DAY_FULL = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
const TH_DAY = ['อา.', 'จ.', 'อ.', 'พ.', 'พฤ.', 'ศ.', 'ส.'];
const TH_MONTH_FULL = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
const TH_MONTHS = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];

/* ====================== ตัวช่วย ====================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, k) => { const d = parse(s); d.setDate(d.getDate() + k); return iso(d); };
const dow = s => parse(s).getDay();
const daysBetween = (a, b) => Math.round((parse(b) - parse(a)) / 864e5);
const thDate = (s, day = true) => { const d = parse(s); return `${day ? TH_DAY[d.getDay()] + ' ' : ''}${d.getDate()} ${TH_MONTHS[d.getMonth()]}`; };
const thLong = s => { const d = parse(s); return `${d.getDate()} ${TH_MONTH_FULL[d.getMonth()]} ${d.getFullYear() + 543}`; };
const nowHM = () => { const d = new Date(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const money = n => (+n).toLocaleString('th-TH', { maximumFractionDigits: 2 });
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200); }

/* ====================== ข้อมูล ====================== */
const db = { tasks: {}, rules: {}, occ: {}, pa: {}, settings: structuredClone(DEFAULT_SETTINGS), ext: {} };
Object.keys(EXT).forEach(k => db.ext[k] = {});
const LOCAL_KEY = 'today-local-v1', MIRROR_KEY = 'today-cloud-mirror-v1';
let cloud = null, syncState = 'local';
function loadFrom(key) {
  try { const d = JSON.parse(localStorage.getItem(key) || 'null'); if (d) { db.tasks = d.tasks || {}; db.rules = d.rules || {}; db.occ = d.occ || {}; db.pa = d.pa || {}; db.settings = { ...structuredClone(DEFAULT_SETTINGS), ...(d.settings || {}) }; if (d.ext) db.ext = { ...db.ext, ...d.ext }; } } catch (e) { console.warn(e); }
}
function saveSnapshot() { try { localStorage.setItem(cloud ? MIRROR_KEY : LOCAL_KEY, JSON.stringify(db)); } catch (e) { console.warn(e); } }
const docRef = (col, id) => cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, COL[col], id);
function put(col, obj, quiet) {
  db[col][obj.id] = obj;
  if (cloud) cloud.fs.setDoc(docRef(col, obj.id), JSON.parse(JSON.stringify(obj))).catch(e => toast('ซิงก์ไม่สำเร็จ: ' + e.code));
  saveSnapshot(); if (!quiet) render();
}
function del(col, id, quiet) {
  delete db[col][id]; saveSnapshot(); if (!quiet) render();
  if (cloud) cloud.fs.deleteDoc(docRef(col, id)).catch(e => toast('ซิงก์ไม่สำเร็จ: ' + e.code));
}
function putSettings(patch) {
  db.settings = { ...db.settings, ...patch }; saveSnapshot(); render();
  if (cloud) cloud.fs.setDoc(cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, 'meta', 'today_settings'), db.settings).catch(e => toast('ซิงก์ไม่สำเร็จ: ' + e.code));
}

/* ====================== ตรรกะ ====================== */
const cat = id => db.settings.cats.find(c => c.id === id) || { id: '', name: 'ทั่วไป', color: '#8a85a3' };
const period = n => db.settings.periods.find(p => p.n === +n);
const ruleTime = r => r.source === 'tt' ? [period(r.p1)?.s || null, period(r.p2 || r.p1)?.e || null] : [r.time || null, r.end || null];
const ruleActive = (r, d) => (r.startDate || '0000') <= d && (!r.endDate || d <= r.endDate) && (r.days || []).includes(dow(d));
const occKey = (rid, d) => `${rid}_${d}`;
function ruleTitle(r) { return r.source === 'tt' ? `${r.title}${r.room ? ' · ห้อง ' + r.room : ''}` : r.title; }
// รวมงานของวันหนึ่ง: งานครั้งเดียว + งานซ้ำ/ตารางสอน
function itemsOn(d) {
  const out = [];
  Object.values(db.tasks).forEach(t => { if (t.date === d) out.push({ kind: 'task', id: t.id, t, title: t.title, time: t.time || null, end: t.end || null, cat: t.cat, important: t.important, done: !!t.done, subs: t.subs || [] }); });
  Object.values(db.rules).forEach(r => {
    if (!ruleActive(r, d)) return;
    const o = db.occ[occKey(r.id, d)] || {};
    const [s, e] = ruleTime(r);

/* ====================== ตัวแยกข้อความพิมพ์เร็ว ====================== */
const DAY_WORDS = [['พฤหัสบดี', 4], ['พฤหัส', 4], ['อาทิตย์', 0], ['จันทร์', 1], ['อังคาร', 2], ['พุธ', 3], ['ศุกร์', 5], ['เสาร์', 6]];
function parseQuick(text, base) {
  let s = ' ' + text + ' ', date = base, time = null, end = null, important = false, catId = null, m;
  if (/!/.test(s)) { important = true; s = s.replace(/!/g, ' '); }
  if ((m = s.match(/#(\S+)/))) { const c = db.settings.cats.find(c => c.name.startsWith(m[1]) || c.name.includes(m[1])); if (c) { catId = c.id; s = s.replace(m[0], ' '); } }
  if ((m = s.match(/\s(\d{1,2})[:.](\d{2})\s*[-–]\s*(\d{1,2})[:.](\d{2})(?=\s)/))) { time = `${pad(m[1])}:${m[2]}`; end = `${pad(m[3])}:${m[4]}`; s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\s(\d{1,2})[:.](\d{2})(?=\s)/)) && +m[1] < 24) { time = `${pad(m[1])}:${m[2]}`; s = s.replace(m[0], ' '); }
  const today = todayISO();
  if ((m = s.match(/\s(วันนี้)(?=\s)/))) { date = today; s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\s(พรุ่งนี้)(?=\s)/))) { date = addDays(today, 1); s = s.replace(m[0], ' '); }
  else if ((m = s.match(/\s(มะรืน(?:นี้)?)(?=\s)/))) { date = addDays(today, 2); s = s.replace(m[0], ' '); }
  // วันที่: "วันที่ 20/11" หรือ "20 พ.ย." (ไม่จับ 6/4 เฉย ๆ เพราะชนกับชื่อห้อง)
  else if ((m = s.match(/\sวันที่\s*(\d{1,2})\/(\d{1,2})(?=\s)/)) || (m = s.match(new RegExp(`\\s(\\d{1,2})\\s*(${TH_MONTHS.map(x => x.replace(/\./g, '\\.')).join('|')})(?=\\s)`)))) {
    const mo = isNaN(+m[2]) ? TH_MONTHS.indexOf(m[2]) + 1 : +m[2];
    const y = new Date().getFullYear(); let d = `${y}-${pad(mo)}-${pad(m[1])}`; if (d < addDays(today, -60)) d = `${y + 1}-${pad(mo)}-${pad(m[1])}`; date = d; s = s.replace(m[0], ' ');
  } else {
    for (const [w, k] of DAY_WORDS) {
      const re = new RegExp(`\\s(?:วัน)?${w}(?:หน้า)?(?=\\s)`);
      if ((m = s.match(re))) { const from = date || today; let diff = (k - dow(from) + 7) % 7; if (/หน้า/.test(m[0])) diff += diff === 0 ? 7 : 7; date = addDays(from, diff); s = s.replace(m[0], ' '); break; }
    }
  }
  return { title: s.replace(/\s+/g, ' ').trim(), date, time, end, important, cat: catId };
}

// แก้งานซ้ำทั้งชุด (มีผลตั้งแต่วันที่เลือก)
function splitRule(r, eff, patch) {
  if ((r.startDate || '0000') >= eff) { patch ? put('rules', { ...r, ...patch }) : del('rules', r.id); return; }
  put('rules', { ...r, endDate: addDays(eff, -1) });
  if (patch) put('rules', { ...r, ...patch, id: uid(), startDate: eff, endDate: r.endDate || null, createdAt: Date.now() });
}

  const sh = openSheet(`

// นำเข้าตารางสอนทั้งชุด (Claude ใช้ตอนอ่านภาพตารางสอนให้)
function importTimetable(entries, { name = '', startDate = todayISO(), replace = true } = {}) {
  if (replace) Object.values(db.rules).filter(r => r.source === 'tt' && (!r.endDate || r.endDate >= startDate)).forEach(r => splitRule(r, startDate, null));
  entries.forEach(e => put('rules', { id: uid(), source: 'tt', set: name, title: e.title, room: e.room || '', days: [e.day], p1: e.p1, p2: e.p2 || e.p1, cat: e.cat || 'teach', startDate, endDate: null, createdAt: Date.now() }, true));
  putSettings({ ttName: name });
  return `นำเข้า ${entries.length} รายการ`;
}

  $('#cIn').onclick = async () => {
    try { const api = await loadFirebase(); await api.authApi.signInWithEmailAndPassword(api.auth, $('#cEmail').value.trim(), $('#cPass').value); }
    catch (e) { alert('เข้าสู่ระบบไม่สำเร็จ: ' + (e.code || e.message)); }
  };
}

/* ====================== Google Drive (ผ่าน Apps Script ของบัญชีนี้) ======================
   ที่อยู่ประตู (url) และรหัสลับ (key) เก็บใน Firebase: users/{uid}/meta/drive — อ่านได้เฉพาะบัญชีที่ล็อกอิน
   ไม่ใส่ไว้ในโค้ดนี้ เพราะโค้ดแอปเปิดสาธารณะบน GitHub */
let driveCfg = null;
async function loadDriveCfg() {
  if (!cloud) return null;
  try { const s = await cloud.fs.getDoc(cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, 'meta', 'drive')); driveCfg = s.exists() ? s.data() : null; } catch (e) { console.warn(e); }
  return driveCfg;
}
async function driveCall(body) {
  if (!driveCfg) await loadDriveCfg();
  if (!driveCfg?.url) throw new Error('ยังไม่ได้เชื่อม Google Drive');
  const r = await fetch(driveCfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, key: driveCfg.key }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'drive-error');
  return j;
}
const blobToB64 = b => new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(',')[1]); fr.onerror = rej; fr.readAsDataURL(b); });
const dataUrlToBlob = u => { const [h, d] = u.split(','); const mime = h.match(/:(.*?);/)[1]; const bin = atob(d); const a = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) a[i] = bin.charCodeAt(i); return new Blob([a], { type: mime }); };
async function driveUpload(path, name, blob, opts = {}) {
  return (await driveCall({ action: 'upload', path, name, mime: blob.type || 'application/octet-stream', data: await blobToB64(blob), ...opts })).file;
}
// ไฟล์ใหญ่: แบ่งส่งทีละช่วงตรงเข้า Drive (resumable upload) ไม่จำกัดขนาด — onProgress(0..1)
async function driveUploadLarge(path, name, file, opts = {}, onProgress = () => {}) {
  const s = await driveCall({ action: 'startUpload', path, name, mime: file.type || 'application/octet-stream', size: file.size, origin: location.origin, description: opts.description || '' });
  const CH = 8 * 1024 * 1024; let off = 0, last = null;
  const putChunk = (start, end) => new Promise((res, rej) => {
    const x = new XMLHttpRequest(); x.open('PUT', s.uploadUrl);
    x.setRequestHeader('Content-Range', `bytes ${start}-${end - 1}/${file.size}`);
    x.upload.onprogress = e => onProgress((start + e.loaded) / file.size);
    x.onload = () => res(x); x.onerror = () => rej(new Error('เน็ตหลุดระหว่างส่ง'));
    x.send(file.slice(start, end));
  });
  while (off < file.size) {
    const end = Math.min(off + CH, file.size);
    let x, tries = 0;
    for (;;) { try { x = await putChunk(off, end); break; } catch (e) { if (++tries > 3) throw e; await new Promise(r => setTimeout(r, 1500 * tries)); } }
    if (x.status === 308) { const r = x.getResponseHeader('Range'); off = r ? +r.split('-')[1] + 1 : end; }
    else if (x.status >= 200 && x.status < 300) { last = JSON.parse(x.responseText || '{}'); off = file.size; }
    else throw new Error('ส่งไฟล์ไม่สำเร็จ (' + x.status + ')');
  }
  onProgress(1);
  return (await driveCall({ action: 'info', id: last.id })).file;
}
// รูปเล็ก (ไอคอน) ที่เก็บใน Drive: จำไว้ในเครื่องเพื่อแสดงผลเร็วและใช้ออฟไลน์ได้
const imgCacheKey = id => 'drive-img-' + id;
const imgPending = new Set();
function driveImg(id) {
  let v = null; try { v = localStorage.getItem(imgCacheKey(id)); } catch (e) {}
  if (v) return v;
  if (!imgPending.has(id) && cloud) {
    imgPending.add(id);
    driveCall({ action: 'get', id }).then(j => { try { localStorage.setItem(imgCacheKey(id), `data:${j.file.mime};base64,${j.data}`); } catch (e) {} render(); }).catch(() => {}).finally(() => setTimeout(() => imgPending.delete(id), 30000));
  }
  return null;
}
// สำรองข้อมูลวันละครั้ง: ไฟล์ .json ลงโฟลเดอร์ [ชื่อแอป]/สำรองข้อมูล/[ปี พ.ศ.]
async function dailyBackup(appName, getData) {
  if (!cloud) return;
  const today = todayISO();
  const ref = cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, 'meta', 'drive_backups');
  try {
    const s = await cloud.fs.getDoc(ref);
    if (s.exists() && s.data()[appName] === today) return;
    if (!(await loadDriveCfg())?.url) return;
    const blob = new Blob([JSON.stringify({ app: appName, date: today, data: getData() }, null, 1)], { type: 'application/json' });
    await driveUpload([appName, 'สำรองข้อมูล', String(+today.slice(0, 4) + 543)], `${appName}-สำรอง-${today}.json`, blob, { replace: true });
    await cloud.fs.setDoc(ref, { [appName]: today }, { merge: true });
  } catch (e) { console.warn('backup', e); }
}

/* ====================== Firebase ====================== */
let fbApi = null;
async function loadFirebase() {
  if (fbApi) return fbApi;
  const base = `https://www.gstatic.com/firebasejs/${FIREBASE_VER}/`;
  const [app, authApi, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const a = app.initializeApp(FIREBASE_CONFIG);
  const auth = authApi.getAuth(a);
  let fsdb;
  try { fsdb = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); } catch (e) { fsdb = fs.getFirestore(a); }
  fbApi = { auth, authApi, fs, fsdb };
  authApi.onAuthStateChanged(auth, user => { if (user) startCloud(user); else { syncState = 'local'; showSync(); } });
  return fbApi;
}
function startCloud(user) {
  if (cloud && cloud.uid === user.uid) return;
  const { fs, fsdb, auth, authApi } = fbApi;
  const localData = JSON.parse(localStorage.getItem(LOCAL_KEY) || 'null');
  cloud = { fs, fsdb, auth, authApi, uid: user.uid, email: user.email };
  localStorage.setItem('today-signed-in', '1');
  loadFrom(MIRROR_KEY);
  const seen = new Set();
  const done = () => {
    if (seen.size < 5) return;
    if (!startCloud.backed) { startCloud.backed = true; loadDriveCfg().then(() => { render(); setTimeout(() => dailyBackup('วันนี้', () => { const { ext, ...mine } = db; return mine; }), 4000); }); }
    if (localData && (Object.keys(localData.tasks || {}).length || Object.keys(localData.rules || {}).length) && !localStorage.getItem('today-migrated-' + user.uid)) {
      localStorage.setItem('today-migrated-' + user.uid, '1');
      if (confirm('พบงานที่บันทึกในเครื่องนี้ อัปโหลดขึ้นคลาวด์ไหม?')) for (const col of ['tasks', 'rules', 'occ']) Object.values(localData[col] || {}).forEach(o => put(col, o, true));
    }
  };
  let t = null; const soon = () => { clearTimeout(t); t = setTimeout(() => { saveSnapshot(); render(); }, 60); };
  const mark = (k, snap) => { seen.add(k); syncState = snap.metadata.fromCache ? 'offline' : (snap.metadata.hasPendingWrites ? 'pending' : 'synced'); showSync(); soon(); done(); };
  for (const col of ['tasks', 'rules', 'occ', 'pa']) {
    fs.onSnapshot(fs.collection(fsdb, 'users', user.uid, COL[col]), { includeMetadataChanges: true }, snap => {
      const o = {}; snap.forEach(d => o[d.id] = d.data()); db[col] = o; mark(col, snap);
    }, e => { syncState = 'error'; showSync(); toast('ซิงก์ผิดพลาด: ' + e.code); });
  }
  fs.onSnapshot(fs.doc(fsdb, 'users', user.uid, 'meta', 'today_settings'), { includeMetadataChanges: true }, snap => {
    if (snap.exists()) db.settings = { ...structuredClone(DEFAULT_SETTINGS), ...snap.data() }; mark('settings', snap);
  });
  for (const [k, col] of Object.entries(EXT)) {
    fs.onSnapshot(fs.collection(fsdb, 'users', user.uid, col), snap => { const o = {}; snap.forEach(d => o[d.id] = d.data()); db.ext[k] = o; soon(); }, () => {});
  }
  showSync(); renderCloudBox();
}
function showSync() {
  $('#sync').textContent = cloud ? ({ synced: '☁️ ซิงก์แล้ว', pending: '☁️ กำลังซิงก์', offline: '☁️ ออฟไลน์', error: '⚠️ ซิงก์ไม่ได้' }[syncState] || '☁️') : '🔑 ยังไม่ล็อกอิน';
}

/* ====================== เริ่มต้น ====================== */
window.addEventListener('error', e => toast('เกิดข้อผิดพลาด: ' + (e.message || '').slice(0, 60)));
window.addEventListener('unhandledrejection', e => { const m = String(e.reason?.message || e.reason || ''); if (!/badge/i.test(m)) toast('เกิดข้อผิดพลาด: ' + m.slice(0, 60)); });
$('#btnSettings').onclick = showSettings;
$('#btnAdd').onclick = () => showTaskForm(null, tab === 'inbox' ? null : (tab === 'day' ? viewDate : todayISO()));
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.tab; if (tab === 'day' || tab === 'week') viewDate = todayISO(); render(); });
loadFrom(localStorage.getItem('today-signed-in') ? MIRROR_KEY : LOCAL_KEY);
render(); showSync();
document.fonts.ready.then(render);
loadFirebase().catch(e => { console.warn(e); syncState = 'error'; showSync(); });
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
let lastDay = todayISO();
document.addEventListener('visibilitychange', () => { if (!document.hidden) { if (todayISO() !== lastDay) { lastDay = todayISO(); viewDate = lastDay; } render(); } });
setInterval(() => { if (tab === 'day' && !$('#dlg').open && document.activeElement?.id !== 'qIn') render(); }, 60000);
window.__today = { db, render, importTimetable, parseQuick, put, del, driveCall, setDrive: async (url, key) => { await cloud.fs.setDoc(cloud.fs.doc(cloud.fsdb, 'users', cloud.uid, 'meta', 'drive'), { url, key }); driveCfg = { url, key }; render(); return 'ok'; } };
